[pytest]
testpaths = tests
asyncio_mode = auto
# A single event loop for the whole session: the SQLAlchemy engine keeps pooled
# connections bound to the loop that created them, so per-test loops break the
# pool (RuntimeError: Event loop is closed).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra -m "not integration"
markers =
    integration: requires a running PostgreSQL exposed by docker-compose
