# Alembic configuration for the Education Platform backend.
#
# The database URL is injected from app.core.config at runtime (see env.py),
# so no credentials are stored here. Run commands from the `backend/` directory:
#
#   .\.venv\Scripts\alembic.exe upgrade head
#   .\.venv\Scripts\alembic.exe revision --autogenerate -m "message"

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Placeholder: overwritten by alembic/env.py from the application settings.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
