<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ee" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Бесплатная платформа открытого образования: изучайте курсы, отслеживайте прогресс и делитесь знаниями." />
    <title>Education Platform</title>
    <script>
      try {
        const preference = localStorage.getItem('education-platform-theme');
        const theme = preference === 'light' || preference === 'dark'
          ? preference
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
